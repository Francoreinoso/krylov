# Textos de pantalla, versión minera (D-37, sáb 12:30). Dueño: seguimiento.
# Son las plantillas de `contratos/CONTRATO.md`, sección 5: `nucleo/` las llena con los números del JSON del motor.
# Ningún texto de industria va en el código: lo propio de cada caso (unidad, rótulos, costos) sale de casos/<nombre>.yaml.
# Sin jerga, ni estadística ni minera (GLOSARIO.md, «Minería en simple»). Los colores son decisiones, no pronósticos:
# nunca «este camión falla», siempre «conviene adelantar la mantención».
#
# Variables (formato de Python, str.format):
#   {n_actuar} {n_no_actuar} {n_en_duda} {n_unidades}   conteos por color y total de unidades por decidir
#   {unidad_singular} {unidad_plural}                    de casos/<nombre>.yaml → unidad
#   {actuar} {no_actuar} {en_duda}                       de rotulos, tal cual (con mayúscula inicial)
#   {actuar_min} {en_duda_min}                           los mismos, con minúscula inicial
#   {costo_de_no_saber}                                  el total, ya escrito con `formato_plata` (abajo)
#   {factor} {factor_min}                                etiqueta de un factor de `factores`, con y sin mayúscula inicial
#   {columna}                                            nombre de una columna del archivo, tal cual
#   {n} {k} {dijimos} {paso} {segundos} {millones}       números del examen, del sello o de «¿Dónde mido?» (porcentajes ya multiplicados por 100)
# Si una frase necesita un número que no existe en el JSON, la frase no se muestra. Nunca se inventa el número.

formato_plata:
  # Cómo se escribe la plata en titulares y frases (el número grande usa la cifra completa: «US$ 7.420»).
  menos_de_mil: "US$ {valor}"                  # US$ 850
  miles: "cerca de {miles} mil dólares"        # 7.420 → cerca de 7 mil dólares
  millones: "cerca de {millones} millones de dólares"   # 2.656.390 → cerca de 2,7 millones de dólares (un decimal, coma)
  cero: "nada"

titular:
  verde_o_amarillo:
    con_duda: "{n_en_duda} {unidad_plural} están en duda. No saber te cuesta {costo_de_no_saber}."
    una_en_duda: "1 {unidad_singular} está en duda. No saber te cuesta {costo_de_no_saber}."
    sin_duda: "Ninguna duda que valga plata: con estos costos, la decisión está clara en todas las {unidad_plural}."
  rojo_datos: "No respondo todavía: con estos datos no alcanza."
  rojo_modelo:
    columna_delata: "No respondo todavía: una columna delata la respuesta."
    no_se_parece: "No respondo todavía: este archivo no se parece a nada que haya visto."

en_palabras:
  # Hasta tres frases, en este orden, solo las que apliquen.
  hay_actuar: "En {n_actuar} {unidad_plural} {actuar_min}, y saber más no cambiaría la decisión."
  hay_actuar_una: "En 1 {unidad_singular} {actuar_min}, y saber más no cambiaría la decisión."      # cuando n_actuar == 1
  hay_en_duda: "En {n_en_duda} {unidad_plural} los datos no alcanzan para decidir."
  hay_en_duda_una: "En 1 {unidad_singular} los datos no alcanzan para decidir."      # cuando n_en_duda == 1
  factor_seguro: "Lo que más pesa: {factor_min}."
  factor_no_se_sabe: "{factor}: con estos datos no se puede saber si sube o baja el riesgo."
  # Motor espacial (`leyes`, y `terreno`): reemplazan a las anteriores. Son genéricas: lo propio de cada caso sale
  # de sus rótulos. Caben tres: el color «no hace falta» no lleva frase (el mapa ya lo muestra), para que salga «qué manda».
  espacial:
    hay_actuar: "En {n_actuar} {unidad_plural} {actuar_min}, y una muestra más no cambiaría la decisión."
    hay_actuar_una: "En 1 {unidad_singular} {actuar_min}, y una muestra más no cambiaría la decisión."   # cuando n_actuar == 1
    hay_en_duda: "En {n_en_duda} {unidad_plural} no se sabe: ahí conviene medir antes de decidir."
    hay_en_duda_una: "En 1 {unidad_singular} no se sabe: ahí conviene medir antes de decidir."            # cuando n_en_duda == 1
    manda: "Aquí manda: {factor_min}."

semaforo:
  amarillo:
    pocos_por_grupo: "Respondo, con un aviso: hay grupos con muy pocas {unidad_plural} y ahí el rango es ancho."
    cerca_del_borde: "Respondo, con un aviso: el archivo se parece a lo que practiqué, pero está cerca del borde."
  rojo_datos:
    pocas_filas: "Hay {n} {unidad_plural} con datos suficientes. Con tan pocas no alcanza para responder."   # la llena nucleo/tabla.py con {n}
    casi_ningun_si: "Solo {k} de {n} {unidad_plural} tienen un «sí». Con tan pocos casos no se puede separar el riesgo."   # motores antiguos; se borra en A-32
    pocas_muestras: "Hay {n} muestras y hacen falta al menos {k}."                 # leyes: muy pocos pozos
    serie_corta: "Hay {n} {unidad_plural} con menos de {k} mediciones: con tan poca historia no se puede decir hacia dónde van."   # motores de series
  rojo_modelo:
    columna_delata: "La columna «{columna}» adivina sola la respuesta: solo tiene dato cuando la respuesta ya se sabe. Con ella cualquier análisis parece perfecto y no sirve para decidir."
    no_se_parece: "Este archivo no se parece a nada de lo que practiqué. Prefiero no responder antes que responder mal. Revisa que cada columna esté en su papel y en sus unidades."
  propuesta:
    quitar_columna: "Propongo sacar la columna «{columna}» y responder con las demás."
    boton: "Sacarla y responder"
  despues_de_corregir: "Sin esa columna, el archivo cae dentro de lo que practiqué. Ahora sí respondo."

examen:
  # La frase la arma el servicio con `tramos` (CONTRATO.md 3): nunca a mano.
  # Sin artículo ni unidad, para que sirva en los cuatro casos de lista. Con datos simulados, la pantalla agrega
  # «con datos simulados» (el caso trae `sintetico: true`): la respuesta escondida es la del archivo `<caso>_verdad.csv`.
  tabla: "Cuando dijimos cerca de {dijimos}% de riesgo, {paso_verbo} el {paso}%."
  verbo_por_caso: { taludes: "cedió", flotacion: "quedó bajo la meta", flota: "falló antes de su mantención", sismicidad: "tuvo un temblor fuerte" }
  espacial: "Escondimos {n} muestras y las adivinamos: {k} cayeron dentro del rango que dimos."
  con_datos_simulados: "Con datos simulados: la respuesta correcta estaba escondida y Krylov no la vio."
  sin_medir: "Exactitud en medición."

sello:
  practico: "Practicó con {millones} millones de {casos_simulados}."        # el adjetivo va en cada motor, por la concordancia
  casos_simulados_por_motor: { espacial: "bancos de roca simulados", deformacion: "paredes simuladas", cinetica: "plantas simuladas", desgaste: "flotas de camiones simuladas", sismico: "túneles simulados" }
  cobertura: "Cuando da un rango de 90%, acierta {cobertura}%."
  peor_grupo: "En el caso más difícil ({peor_grupo}) acierta {cobertura_peor}%."
  contra_lento: "Da lo mismo que el método lento de siempre, que tarda {minutos_lento} minutos; Krylov tarda {ms} milisegundos."
  red: "Respondió la red que practicó con casos simulados."
  precalculado: "Precalculado con el método lento de siempre: tardó {minutos_lento} minutos."

precalculado:
  rotulo: "precalculado"
  explicacion: "Esta respuesta la calculamos antes con el método lento de siempre. Los deslizadores sí funcionan en vivo."
  # Motor espacial con KRYLOV_ESPACIAL_THETA=mcmc: el mapa y «¿Dónde perforo?» salen de la red; «qué manda» sale del
  # método lento precalculado. Nunca se dice que «qué manda» lo respondió la red.
  que_manda_rotulo: "precalculado"
  pie_espacial_mixto: "El mapa lo respondió la red que practicó con terrenos simulados. «Qué manda» lo calculamos antes con el método lento de siempre."
  ejemplo_rotulo: "ejemplo"                                     # D-37: tarjeta nueva que todavía pinta su ejemplo fijo
  ejemplo_explicacion: "Números de ejemplo para mostrar la pantalla. El motor de esta decisión se está entrenando hoy."

curva:
  # Casos de lista (D-37): el dibujo de una unidad. Los nombres de los ejes salen del caso (`eje_tiempo`, `eje_valor`).
  titulo: "Lo medido y lo que Krylov cree que viene"
  medido: "Medido"
  ahora: "Ahora"
  abanico: "Rango creíble de lo que viene (9 de cada 10 futuros simulados caen aquí)"
  limite: "Límite"
  falta: "Faltan entre {bajo} y {alto} {unidad_tiempo}."            # taludes: `curva.marca`
  sin_curva: "Esta unidad no tiene curva."
  fuera: "El rango sigue subiendo más allá del gráfico."        # cuando el abanico sale por arriba y la web corta el eje

yacimiento:
  # La sexta decisión (D-40, D-42): un recorrido calculado antes, con lo que dibuja pitch/deck/yacimiento.html.
  # Su red no corre en el servicio y su sello no pasa: se cuenta solo el mapa (M-63).
  titulo: "¿Dónde está el mineral?"
  quien: "Geólogo de exploración"
  archivo: "Las muestras de las perforaciones: dónde se perforó, a qué profundidad y cuánto cobre trae la roca."
  ver: "Ver el recorrido"
  que_es: "Yacimiento simulado y respuesta calculada antes. Esta decisión todavía no recibe archivos."
  sello: "De este modelo se cuenta solo su mapa: en yacimientos simulados nuevos, el cobre de verdad cayó dentro del rango que dio Krylov en 9 de cada 10 bloques. El resto de su comprobación todavía no pasa."
  angosto: "El recorrido en tres dimensiones se ve en una pantalla más ancha."
