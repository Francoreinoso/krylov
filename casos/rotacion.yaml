# Caso de uso: una pregunta de negocio resuelta con un motor, un archivo de datos y sus costos.
# Dueño: seguimiento. Formato: contratos/CONTRATO.md, sección 4. Skill: `agregar-caso`.
# Es el caso que abre el demo (tarea S-03).
# Los costos son supuestos del demo: se muestran como deslizadores y se dicen como supuestos.
nombre: rotacion
tarjeta:
  titulo: "¿A quién conviene retener?"
  empresa_o_industria: "Caso tipo Buk"
  sponsor: Buk
  oculto: false
pregunta: "¿A qué personas conviene ofrecerles un plan de retención, y cuánto cuesta no saberlo?"
motor: supervivencia
unidad: { singular: persona, plural: personas }
rotulos:
  actuar: "Conviene retener"
  no_actuar: "No hace falta"
  en_duda: "No sabemos si conviene"
  costo_de_no_saber: "Lo que te cuesta no saber"
# Columnas por papel en el modelo generativo (WORKPLAN.md, sección 11.2; decisión D-26). Verificadas contra el CSV.
columnas:
  id: EmployeeNumber
  evento: Attrition            # Yes = renunció. Vacío en el 20% por decidir (la verdad va en rotacion_verdad.csv)
  tiempo: YearsAtCompany       # años enteros en la empresa; 44 personas tienen 0: la censura es por intervalos de un año
  grupo: JobRole               # 9 cargos. Department tiene solo 3 niveles y no sirve como efecto por grupo
  efectos: [OverTime, DistanceFromHome, NumCompaniesWorked]
  suave: MonthlyIncome         # efecto no lineal (spline), en logaritmo
  encuestas: [EnvironmentSatisfaction, JobSatisfaction, RelationshipSatisfaction, WorkLifeBalance]   # ordinales de 1 a 4
  extra: []                    # columnas que el archivo declara como factor y el modelo no usa; las revisa el semáforo
  disponibles: 35            # columnas del archivo original (verificado). Tres son constantes: EmployeeCount, Over18, StandardHours
  elegidas_por: equipo
# Nombre en pantalla de cada columna o factor (lo lee nucleo/; sin esto se muestra el nombre de la columna).
etiquetas: { OverTime: "Horas extra", DistanceFromHome: "Distancia a la casa", NumCompaniesWorked: "Empresas anteriores", MonthlyIncome: "Sueldo", JobRole: "Cargo", EnvironmentSatisfaction: "Satisfacción con el ambiente", JobSatisfaction: "Satisfacción con el trabajo", RelationshipSatisfaction: "Satisfacción con las relaciones", WorkLifeBalance: "Equilibrio entre trabajo y vida", compromiso: "Compromiso (según las cuatro encuestas)" }
costos:
  falso_si: { valor: 1500, min: 200, max: 5000, etiqueta: "Costo de un plan de retención", tipo: hipótesis, cifra: K-01 }
  falso_no: { valor: 6000, min: 1000, max: 20000, etiqueta: "Costo de reemplazar a alguien", tipo: hipótesis, cifra: K-02 }
moneda: USD
dataset: datos/demo/rotacion.csv
verdad: datos/demo/rotacion_verdad.csv     # la respuesta real del 20% que se dejó vacío al azar
origen_datos: "Datos públicos de ejemplo, ficticios, creados por IBM. No son datos de Buk."
sintetico: false
cartera: { modo: simulada, n: 1000 }       # 1.000 empresas distintas salidas del simulador de `supervivencia`; la pantalla dice «simuladas»
