# RETIRADO por el pivote a minería (D-37, sáb 12:10). Ya no aparece en el inicio.
# Este archivo se borra junto con su motor en la tarea A-32; hasta entonces lo leen las pruebas de `nucleo/`.
# Caso de uso. Dueño: seguimiento. Formato: contratos/CONTRATO.md, sección 4. Skill: `agregar-caso`.
# Tarea S-07. La licencia del archivo es CC BY-NC-SA 4.0 (no comercial): el CSV NO se sube al repositorio.
# Se agrega a .gitignore y el caso vive en local y en las respuestas precalculadas, con la atribución en `origen_datos`.
# `dias_de_espera` se calcula de ScheduledDay y AppointmentDay. Los nombres traen errores de origen (Hipertension, Handcap): copiarlos tal cual.
# Hay edades de -1: se descartan. `No-show = Yes` significa que la persona NO llegó.
# `Neighbourhood` es el barrio del centro de atención (81 distintos): es el grupo del modelo.
# MUESTRA (D-26): no se muestrean filas sueltas. Se eligen 30 barrios con semilla fija y, dentro de ellos, pacientes completos
# (todas sus citas) hasta llegar a unas 2.000 citas, cuidando que al menos un tercio de los pacientes tenga 2 o más citas.
# Hecho en datos/preparar/inasistencias.py (S-N1, sáb 04:45): 30 barrios al azar entre los 74 con al menos 100 citas,
# 66 citas por barrio (1.980 en total), 1.147 pacientes, 38% con 2 o más citas. Cada paciente va a un solo barrio.
# Columnas verificadas contra el CSV generado. inasistencias.csv e inasistencias_verdad.csv están en .gitignore.
# El script calcula `dias_de_espera` (se descartan las 5 filas negativas) y `dia_semana` (0 = lunes; los 39 sábados se descartan).
# Datos que fijan el modelo: 35% de las citas son del mismo día (4,6% de inasistencia) y ninguna de esas recibe SMS.
nombre: inasistencias
tarjeta:
  titulo: "¿Qué citas conviene confirmar?"
  empresa_o_industria: "Caso tipo AgendaPro"
  sponsor: AgendaPro
  oculto: true          # D-37: retirado del inicio; el archivo se borra en A-32
pregunta: "¿Qué reservas tienen riesgo de no llegar y en cuáles conviene gastar una confirmación?"
motor: jerarquico
unidad: { singular: cita, plural: citas }
rotulos:
  actuar: "Conviene confirmar"
  no_actuar: "No hace falta"
  en_duda: "No sabemos si conviene"
  costo_de_no_saber: "Lo que te cuesta no saber"
columnas:
  id: AppointmentID
  objetivo: No-show            # vacío en el 20% por decidir
  paciente: PatientId          # propensión latente por paciente (hay pacientes con varias citas)
  grupo: Neighbourhood         # efecto por barrio
  suave: dias_de_espera        # efecto no lineal (spline) más un salto en «mismo día»
  categoria: dia_semana
  tratamiento: SMS_received    # su efecto puede variar con la espera
  efectos: [Age, Scholarship, Hipertension, Diabetes, Alcoholism]
  extra: []
  disponibles: 14
  elegidas_por: equipo
# Nombre en pantalla de cada columna o factor (lo lee nucleo/; sin esto se muestra el nombre de la columna).
etiquetas: { Age: "Edad", Scholarship: "Beca social", Hipertension: "Hipertensión", Diabetes: "Diabetes", Alcoholism: "Alcoholismo", SMS_received: "Recordatorio por SMS", dias_de_espera: "Días de espera", dia_semana: "Día de la semana", Neighbourhood: "Barrio", PatientId: "Paciente" }
costos:
  falso_si: { valor: 15, min: 2, max: 50, etiqueta: "Costo de confirmar o sobrerreservar una cita", tipo: hipótesis, cifra: K-05 }
  falso_no: { valor: 40, min: 10, max: 200, etiqueta: "Costo de una hora perdida", tipo: hipótesis, cifra: K-06 }
moneda: USD
dataset: datos/demo/inasistencias.csv
verdad: datos/demo/inasistencias_verdad.csv
origen_datos: "Datos públicos reales: 110.527 citas médicas en Brasil (Kaggle, CC BY-NC-SA 4.0). No son datos de AgendaPro."
sintetico: false
