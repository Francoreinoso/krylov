# D-37 (pivote a minería): este caso ya no aparece en el inicio. Se conserva como el examen con DATOS REALES del
# motor `espacial` (24 de 31 mediciones escondidas dentro del rango, M-13) y lo usa el deck. El caso minero es `leyes`.
# Caso de uso espacial: datos con ubicación. Dueño: seguimiento. Formato: contratos/CONTRATO.md, sección 4.
# Es el caso del momento estrella del show: «¿Dónde mido?». Tarea S-04: tiene que estar listo antes de dormir,
# porque `amortizacion` lo necesita a primera hora.
# Probar temprano: el zinc baja al alejarse del río (33 de las 155 muestras superan el umbral), así que el semáforo
# puede salir rojo por tendencia. Si pasa, esa es la historia: «Krylov notó que manda el río».
# El archivo trae 14 columnas; se usan x, y, zinc y dist (distancia normalizada al río). Licencia del paquete de origen: GPL (>= 2).
# D-26: la tendencia con la distancia al río necesita esa distancia en CADA bloque, no solo en los 155 puntos.
# PC 3 baja `meuse.grid` (mismo paquete `sp`: 3.103 celdas con x, y, dist) y lo deja en datos/demo/terreno_grilla.csv (S-04).
# Si ese archivo no está a las 04:30, el motor arranca sin tendencia (dos canales) y la tendencia se estima aparte.
nombre: terreno
tarjeta:
  titulo: "¿Dónde limpio y dónde mido?"
  empresa_o_industria: "Terreno"
  sponsor: null
  oculto: false
pregunta: "¿Qué partes del terreno hay que limpiar, dónde no se sabe, y dónde conviene medir primero?"
motor: espacial
unidad: { singular: bloque, plural: bloques }
rotulos:
  actuar: "Hay que limpiar"
  no_actuar: "No hace falta limpiar"
  en_duda: "No sabemos: conviene medir"
  costo_de_no_saber: "Lo que te cuesta no saber"
columnas: { x: x, y: y, valor: zinc, tendencia: dist, umbral: 720, unidad_valor: "mg/kg", transformacion: log }   # umbral: valor de intervención holandés para zinc, cifra K-11
# Nombre en pantalla de cada factor de «qué manda en el terreno» (lo lee nucleo/ si quiere; hoy están en nucleo/espacial.py con el mismo texto).
etiquetas: { tendencia: "La cercanía al río", continuidad: "Lo que pasa en los bloques vecinos", ruido: "Error de cada medición" }
costos:
  falso_si: { valor: 20000, min: 5000, max: 60000, etiqueta: "Costo de limpiar un bloque", tipo: hipótesis, cifra: K-12 }
  falso_no: { valor: 50000, min: 10000, max: 200000, etiqueta: "Costo de dejar un bloque contaminado", tipo: hipótesis, cifra: K-13 }
  medicion: { valor: 3000, etiqueta: "Costo de una medición", tipo: hipótesis, cifra: K-17 }
moneda: USD
dataset: datos/demo/terreno.csv
grilla: datos/demo/terreno_grilla.csv          # x, y, dist por celda del área de estudio
origen_datos: "Datos públicos reales: 155 muestras de metales en un suelo junto al río Mosa, Países Bajos."
sintetico: false
